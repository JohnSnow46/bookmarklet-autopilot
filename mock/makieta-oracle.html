<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makieta Oracle – test automatyzacji</title>
<style>
  :root {
    --bar: #31465a; --bar-text: #e8eef3; --bg: #eef1f4; --panel: #ffffff;
    --line: #c9d1d9; --text: #1d2730; --muted: #5b6875; --accent: #1f6fb2;
    --ok: #2e7d32; --err: #b3261e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 "Segoe UI", Tahoma, Arial, sans-serif; color: var(--text); background: var(--bg); }
  header { background: var(--bar); color: var(--bar-text); padding: 10px 18px; font-size: 15px; }
  header small { opacity: .7; margin-left: 8px; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); padding: 16px; position: relative; min-height: 120px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  h3 { font-size: 14px; margin: 16px 0 6px; }
  label { display: block; color: var(--muted); font-size: 13px; margin: 10px 0 3px; }
  input, textarea, select { font: inherit; padding: 5px 7px; border: 1px solid #9aa7b3; width: 100%; max-width: 420px; background: #fff; }
  input[readonly] { background: #f3f5f7; }
  textarea { height: 56px; }
  button { font: inherit; padding: 5px 14px; border: 1px solid #7f8d99; background: linear-gradient(#fdfdfd, #e3e7eb); cursor: pointer; margin-top: 10px; }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  table { border-collapse: collapse; margin-top: 12px; width: 100%; }
  th, td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; }
  th { background: #e4e9ee; font-weight: 600; }
  a.xResult { color: var(--accent); }
  .msg { margin-top: 10px; padding: 6px 10px; border-left: 4px solid; }
  .msg.ok { border-color: var(--ok); background: #edf7ee; }
  .msg.err { border-color: var(--err); background: #fbeceb; }
  .busy { position: absolute; inset: 0; background: rgba(255,255,255,.75); display: none; align-items: center; justify-content: center; color: var(--muted); }
  .busy.on { display: flex; }
  .codes button { margin: 3px 4px 0 0; padding: 2px 8px; font-size: 13px; }
  .bm a { display: inline-block; margin: 4px 6px 4px 0; padding: 4px 10px; border: 1px dashed var(--accent); color: var(--accent); text-decoration: none; background: #f4f8fc; }
  #log { font-size: 12px; max-height: 260px; overflow: auto; background: #f7f9fa; border: 1px solid var(--line); padding: 6px; margin: 0; white-space: pre-wrap; }
  .doc { border: 1px solid var(--line); padding: 20px; max-width: 520px; background: #fff; }
  @media print { header, aside, button, .busy { display: none !important; } .wrap { display: block; padding: 0; } .panel { border: 0; } }
</style>
</head>
<body>
<header>System magazynowy <small>makieta do testów, nie prawdziwy Oracle</small></header>
<div class="wrap">
  <main class="panel">
    <div id="view"></div>
    <div class="busy" id="busy">Przetwarzanie…</div>
  </main>
  <aside class="panel">
    <h2>Panel testowy</h2>
    <div id="sideMain">
      <div class="codes">
        Kliknij kod, żeby wpisać go jak czytnik:<br>
        <span id="codes"></span>
      </div>
      <h3>Zakładki (przeciągnij na pasek zakładek)</h3>
      <div class="bm">
        <a id="bmTest">Test</a>
        <a id="bmField">Pokaż pole</a>
        <a id="bmAuto">Auto etap 1</a>
      </div>
    </div>
    <h3>Dziennik</h3>
    <pre id="log"></pre>
  </aside>
</div>

<script>
/* ---------- dane testowe ---------- */
const PRODUCTS = {
  "5901234123457": { name: "Odkurzacz R10 – płyta główna", line: "PCB-R10-MAIN rev.B" },
  "5909876543210": { name: "Moduł lidar LDS-3", line: "LDS-3 SN 22-04419" },
  "5900000000017": { name: "Akumulator 14.4V 5200mAh", line: "BAT-144-52 partia 07/26" }
};
const USERS = [["u1", "Nowak Anna"], ["u2", "Kowalski Jan"], ["u3", "Ty (test)"]];

/* ---------- narzędzia ---------- */
const $ = id => document.getElementById(id);
const view = $("view");
const params = new URLSearchParams(location.search);
function log(t) { const l = $("log"); l.textContent = new Date().toLocaleTimeString() + "  " + t + "\n" + l.textContent; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function busy(ms) {
  $("busy").classList.add("on");
  return new Promise(r => setTimeout(() => { $("busy").classList.remove("on"); r(); }, ms));
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* Model jak we frameworku: wartości trafiają tu tylko przez zdarzenia input/change.
   Jeśli skrypt ustawi samo .value bez zdarzeń, zapis się nie uda – tak jak w prawdziwym systemie. */
let model = {};
function bind(id, key) {
  const el = $(id);
  const upd = () => { model[key] = el.value; };
  el.addEventListener("input", upd);
  el.addEventListener("change", upd);
  upd();
}

/* ---------- widoki ---------- */
function renderSearch() {
  model = {};
  view.innerHTML = `
    <h2>Wyszukiwanie produktu</h2>
    <label for="pt1:r1:0:it1::content">Kod produktu</label>
    <input id="pt1:r1:0:it1::content" autocomplete="off">
    <button id="pt1:r1:0:cb1" type="button">Szukaj</button>
    <div id="pt1:r1:0:res"></div>`;
  const inp = $("pt1:r1:0:it1::content");
  bind("pt1:r1:0:it1::content", "code");
  inp.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
  $("pt1:r1:0:cb1").addEventListener("click", doSearch);
  inp.focus();
}

async function doSearch() {
  const res = $("pt1:r1:0:res");
  res.innerHTML = "";
  const code = (model.code || "").trim();
  log("Szukaj: " + (code || "(puste)"));
  await busy(rnd(600, 1400));
  const p = PRODUCTS[code];
  if (!p) { res.innerHTML = `<div class="msg err">Nie znaleziono produktu o kodzie „${esc(code)}”.</div>`; return; }
  res.innerHTML = `
    <table><tr><th>Kod</th><th>Nazwa</th></tr>
    <tr><td>${esc(code)}</td><td><a href="#" class="xResult" id="pt1:r1:0:t1:0:cl1">${esc(p.name)}</a></td></tr></table>`;
  $("pt1:r1:0:t1:0:cl1").addEventListener("click", async e => {
    e.preventDefault();
    log("Wybrano: " + p.name);
    await busy(rnd(700, 1600));
    renderForm(code, p);
  });
}

function renderForm(code, p) {
  model = {};
  view.innerHTML = `
    <h2>Formularz: ${esc(p.name)}</h2>
    <label for="pt1:r2:0:it1::content">Linia 1 (do skopiowania)</label>
    <input id="pt1:r2:0:it1::content" readonly value="${esc(p.line)}">
    <label for="pt1:r2:0:it2::content">Linia 2 (wklej linię 1)</label>
    <input id="pt1:r2:0:it2::content">
    <label for="pt1:r2:0:it3::content">Linia 3 (dopisz)</label>
    <textarea id="pt1:r2:0:it3::content"></textarea>
    <label for="pt1:r2:0:soc1::content">Użytkownik</label>
    <select id="pt1:r2:0:soc1::content">
      <option value="">– wybierz –</option>
      ${USERS.map(([v, t]) => `<option value="${v}">${esc(t)}</option>`).join("")}
    </select>
    <br><button id="pt1:r2:0:cb_save" type="button">Save</button>
    <div id="pt1:r2:0:msg"></div>`;
  bind("pt1:r2:0:it1::content", "line1");
  bind("pt1:r2:0:it2::content", "line2");
  bind("pt1:r2:0:it3::content", "line3");
  bind("pt1:r2:0:soc1::content", "user");
  $("pt1:r2:0:cb_save").addEventListener("click", () => doSave(code));
}

async function doSave(code) {
  const msg = $("pt1:r2:0:msg");
  const errors = [];
  if (model.line2 !== model.line1) errors.push("Linia 2 musi być kopią linii 1.");
  if (!(model.line3 || "").trim()) errors.push("Linia 3 jest pusta.");
  if (!model.user) errors.push("Nie wybrano użytkownika.");
  if (errors.length) {
    msg.innerHTML = `<div class="msg err">${errors.join("<br>")}</div>`;
    log("Save odrzucony: " + errors.join(" "));
    return;
  }
  await busy(rnd(900, 1800));
  const doc = Math.floor(100000 + Math.random() * 900000);
  log(`Zapisano dokument ${doc} (kod ${code})`);
  renderSaved(code, doc);
}

function renderSaved(code, doc) {
  view.innerHTML = `
    <h2>Dokument ${doc}</h2>
    <div class="msg ok">Zapisano. Wygeneruj wydruk.</div>
    <button id="pt1:r3:0:cb_gen" type="button">Generuj</button>
    <button id="pt1:r3:0:cb_new" type="button">Nowy skan</button>`;
  const gen = $("pt1:r3:0:cb_gen");
  let ready = false;
  gen.addEventListener("click", () => {
    if (ready) {
      log("Print: otwieram nową kartę");
      const w = window.open(location.pathname + "?print=" + doc + "&kod=" + encodeURIComponent(code), "_blank");
      if (!w) log("UWAGA: przeglądarka zablokowała nową kartę");
      return;
    }
    gen.disabled = true;
    gen.textContent = "Generowanie…";
    log("Generowanie wydruku…");
    setTimeout(() => { gen.disabled = false; gen.textContent = "Print"; ready = true; log("Gotowe: przycisk zmienił się na Print"); }, rnd(1500, 3000));
  });
  $("pt1:r3:0:cb_new").addEventListener("click", renderSearch);
}

async function renderPrint() {
  $("sideMain").style.display = "none";
  const doc = params.get("print"), code = params.get("kod") || "";
  const p = PRODUCTS[code] || { name: "?", line: "?" };
  view.innerHTML = `<h2>Podgląd wydruku – dokument ${esc(doc)}</h2><p>Przygotowywanie raportu…</p>`;
  log("Karta wydruku otwarta");
  await busy(rnd(1200, 2500));
  view.innerHTML = `
    <h2>Podgląd wydruku – dokument ${esc(doc)}</h2>
    <div class="doc">
      <strong>Dokument ${esc(doc)}</strong><br>
      Produkt: ${esc(p.name)}<br>
      Kod: ${esc(code)}<br>
      ${esc(p.line)}<br>
      Data: ${new Date().toLocaleString()}
    </div>
    <button id="pt1:p1:cb_apply" type="button">Apply</button>`;
  $("pt1:p1:cb_apply").addEventListener("click", () => { log("Apply → drukowanie"); window.print(); });
}

/* ---------- panel testowy ---------- */
function fillCodeLikeScanner(code) {
  const inp = $("pt1:r1:0:it1::content");
  if (!inp) { renderSearch(); return fillCodeLikeScanner(code); }
  inp.value = code;
  inp.dispatchEvent(new Event("input", { bubbles: true }));
  inp.focus();
  log("Wpisano kod: " + code);
}
$("codes").innerHTML = Object.keys(PRODUCTS).map(c => `<button type="button" data-c="${c}">${c}</button>`).join("")
  + `<button type="button" data-c="1111111111111">nieznany</button>`;
$("codes").addEventListener("click", e => { const c = e.target.dataset.c; if (c) fillCodeLikeScanner(c); });

/* ---------- zakładki (bookmarklety) ---------- */
function bmTest() { alert("ok"); }

function bmField() {
  const e = document.activeElement;
  navigator.clipboard.writeText(e.outerHTML)
    .then(() => alert("Skopiowano: " + e.tagName + " " + e.id))
    .catch(() => prompt("Skopiuj ręcznie:", e.outerHTML));
}

function bmAuto() {
  /* ===== USTAWIENIA ===== */
  const CONFIG = {
    extraLine: "Dopisana linia (test)",
    user: "Ty (test)",
    confirmSave: true   /* na czas testów pyta przed Save */
  };
  /* ===== SELEKTORY (na Oracle podmienisz te wartości) ===== */
  const SEL = {
    search: "pt1:r1:0:it1::content",
    searchBtn: "pt1:r1:0:cb1",
    result: "a.xResult",
    line1: "pt1:r2:0:it1::content",
    line2: "pt1:r2:0:it2::content",
    line3: "pt1:r2:0:it3::content",
    user: "pt1:r2:0:soc1::content",
    save: "pt1:r2:0:cb_save",
    apply: "pt1:p1:cb_apply"
  };

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function waitFor(fn, what, timeout = 20000) {
    const t0 = Date.now();
    while (Date.now() - t0 < timeout) {
      let r = null;
      try { r = fn(); } catch (_) {}
      if (r) return r;
      await sleep(150);
    }
    throw new Error("Nie pojawił się element: " + what);
  }
  const byId = id => document.getElementById(id);
  const btnByText = (txt, d = document) =>
    [...d.querySelectorAll("button, a")].find(b => b.textContent.trim() === txt && !b.disabled && b.offsetParent !== null);
  function setVal(el, v) {
    const proto = el instanceof HTMLTextAreaElement ? HTMLTextAreaElement.prototype
      : el instanceof HTMLSelectElement ? HTMLSelectElement.prototype : HTMLInputElement.prototype;
    Object.getOwnPropertyDescriptor(proto, "value").set.call(el, v);
    el.dispatchEvent(new Event("input", { bubbles: true }));
    el.dispatchEvent(new Event("change", { bubbles: true }));
  }

  (async () => {
    try {
      const search = byId(SEL.search);
      if (!search || !search.value.trim()) throw new Error("Najpierw zeskanuj kod do pola wyszukiwania.");
      byId(SEL.searchBtn).click();
      (await waitFor(() => document.querySelector(SEL.result), "wynik wyszukiwania")).click();

      const line1 = await waitFor(() => byId(SEL.line1), "formularz");
      setVal(byId(SEL.line2), line1.value);
      setVal(byId(SEL.line3), CONFIG.extraLine);
      const sel = byId(SEL.user);
      const opt = [...sel.options].find(o => o.text.trim() === CONFIG.user);
      if (!opt) throw new Error("Brak użytkownika na liście: " + CONFIG.user);
      setVal(sel, opt.value);

      if (CONFIG.confirmSave && !confirm("Zapisać?")) return;
      byId(SEL.save).click();

      (await waitFor(() => btnByText("Generuj"), "przycisk Generuj")).click();
      const printBtn = await waitFor(() => btnByText("Print"), "przycisk Print", 30000);

      /* przejęcie nowej karty: łapiemy okno otwierane przez stronę */
      const origOpen = window.open;
      window.open = function (...args) {
        window.open = origOpen;
        const w = origOpen.apply(window, args);
        if (!w) { alert("Przeglądarka zablokowała nową kartę. Zezwól na wyskakujące okna dla tej strony."); return w; }
        waitFor(() => w.document.getElementById(SEL.apply), "Apply w nowej karcie", 30000)
          .then(b => b.click())
          .catch(e => alert("Karta wydruku: " + e.message));
        return w;
      };
      printBtn.click();
    } catch (e) {
      alert("Automat: " + e.message);
    }
  })();
}

function toBookmarklet(fn) { return "javascript:" + encodeURIComponent("(" + fn.toString() + ")()"); }
$("bmTest").href = toBookmarklet(bmTest);
$("bmField").href = toBookmarklet(bmField);
$("bmAuto").href = toBookmarklet(bmAuto);
document.querySelectorAll(".bm a").forEach(a => a.addEventListener("click", e => {
  e.preventDefault();
  alert("Przeciągnij ten link na pasek zakładek (Ctrl+Shift+B pokazuje pasek), a potem klikaj go z paska.");
}));

/* ---------- start ---------- */
if (params.has("print")) renderPrint(); else renderSearch();
if (location.protocol === "file:") log("UWAGA: otwarto jako plik. Przejęcie nowej karty zadziała tylko przez http://localhost.");
</script>
</body>
</html>
